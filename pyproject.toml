[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sol-organizes-logic"
version = "0.1.0"
description = "Read and explore Hegel's Science of Logic in the terminal"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["hegel", "philosophy", "corpus", "terminal", "reader"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Text Processing",
]
dependencies = []

[project.optional-dependencies]
corpus = ["markdown-it-py>=3,<4"]

[project.scripts]
sol = "sol:cli"
sol-corpus = "sol_corpus:main"
sol-corpus-check = "sol_corpus_contract:main"

[project.urls]
Repository = "https://github.com/dialectmaterial/SOL"
Issues = "https://github.com/dialectmaterial/SOL/issues"

[tool.setuptools]
include-package-data = false
py-modules = [
    "sol",
    "sol_corpus",
    "sol_corpus_contract",
    "sol_corpus_notes",
    "sol_corpus_references",
    "sol_corpus_structure",
    "sol_workspace",
    "sol_workspace_reader",
]
