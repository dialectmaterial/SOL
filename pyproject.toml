[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sol-organizes-logic"
version = "0.1.0"
description = "Read and explore Hegel's Science of Logic in the terminal"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = ["hegel", "philosophy", "corpus", "terminal", "reader"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Text Processing",
]
dependencies = ["prompt-toolkit>=3.0.52,<4", "markdown-it-py>=3,<4", "opendataloader-pdf==2.5.13"]

[project.optional-dependencies]
# ESSENCE's Textual interface; the reader runs without it.
essence = ["textual>=8,<9"]
corpus = []
shell = []
# Older installation commands remain valid; every feature is included normally.
extraction = []

[project.scripts]
sol = "sol:cli"
sol-kitty = "sol.terminal.kitty:main"
sol-corpus = "sol.corpus.convert:main"
sol-corpus-check = "sol.corpus.contract:main"

[project.urls]
Repository = "https://github.com/dialectmaterial/SOL"
Issues = "https://github.com/dialectmaterial/SOL/issues"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["sol", "sol.*"]
namespaces = false

[tool.setuptools.package-data]
"sol.terminal" = ["*.lua"]
