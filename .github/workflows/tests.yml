name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts-and-installation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install reader and build tools
        run: python -m pip install . setuptools wheel
      - name: Enable the native shell pipeline check
        if: matrix.python == '3.14'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zsh ripgrep
      - name: Run public corpus, workspace, reader and archive checks
        run: python -B -m unittest discover -s tests
      - name: Check patch whitespace
        run: git show --format= --check HEAD
